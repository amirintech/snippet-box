{{define "title"}}Home{{end}} {{define "main"}}
<h2 class="text-2xl font-semibold mb-4">Latest Snippets</h2>

{{if .Snippets}}
<!-- Table styling -->
<table
  class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg shadow-sm"
>
  <thead class="bg-gray-50">
    <tr>
      <th
        scope="col"
        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
      >
        Title
      </th>
      <th
        scope="col"
        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
      >
        Created
      </th>
      <th
        scope="col"
        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
      >
        ID
      </th>
    </tr>
  </thead>
  <tbody class="bg-white divide-y divide-gray-200">
    {{range .Snippets}}
    <tr>
      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
        <a
          href="/snippet/view/{{.ID}}"
          class="text-blue-600 hover:text-blue-800 hover:underline"
          >{{.Title}}</a
        >
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{humanDate .Created}}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        #{{.ID}}
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p class="text-gray-600">There's nothing to see here... yet!</p>
{{end}} {{end}}
